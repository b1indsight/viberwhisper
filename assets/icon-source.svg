<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img">
  <title>ViberWhisper application icon</title>
  <desc>Five rounded voice-wave bars whose lower endpoints form a V.</desc>
  <defs>
    <g id="voice-mark">
      <rect x="192" y="224" width="96" height="288" rx="48"/>
      <rect x="328" y="288" width="96" height="352" rx="48"/>
      <rect x="464" y="352" width="96" height="416" rx="48"/>
      <rect x="600" y="288" width="96" height="352" rx="48"/>
      <rect x="736" y="224" width="96" height="288" rx="48"/>
    </g>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="#282c34"/>
  <use href="#voice-mark" fill="#ffffff"/>
</svg>
