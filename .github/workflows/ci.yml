name: CI Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    name: Python (ruff + pytest)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Python test dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check server

      - name: Pytest
        run: uv run pytest

  build-and-test:
    runs-on: macos-latest
    name: CI (macOS)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Validate release package contract
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/validate-release-contract.sh)"
          bash scripts/test-release-notes-contract.sh
          plutil -lint assets/Info.plist.ext
          xmllint --noout wix/main.wxs wix/upgrade-fixture.wxs
          echo "Release package contract is valid for v${version}."

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Discord failure alert
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          AUTHOR="${GITHUB_ACTOR}"
          JOB_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR_NUM=$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")
            BRANCH="PR #${PR_NUM}"
          fi

          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **CI Build Failed** 🔴\n**Branch**: ${BRANCH}\n**Commit**: ${COMMIT} by ${AUTHOR}\n**Link**: ${JOB_URL}\"}" \
            "$DISCORD_WEBHOOK_URL"

  check-windows:
    runs-on: windows-latest
    name: CI (Windows)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --features windows-app

      - name: Test
        run: cargo test --locked --features windows-app

      - name: Clippy
        run: cargo clippy --locked --all-targets --features windows-app -- -D warnings

      - name: Discord failure alert
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          $BRANCH = "$env:GITHUB_REF_NAME"
          $COMMIT = "$env:GITHUB_SHA".Substring(0,7)
          $AUTHOR = "$env:GITHUB_ACTOR"
          $JOB_URL = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $body = @{ content = "🔴 **CI Windows Build Failed** 🔴`n**Branch**: $BRANCH`n**Commit**: $COMMIT by $AUTHOR`n**Link**: $JOB_URL" } | ConvertTo-Json
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -ContentType "application/json" -Body $body
        shell: pwsh
